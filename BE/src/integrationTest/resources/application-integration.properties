spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.generate_statistics=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never

CLOUDINARY_URL=cloudinary://test-key:test-secret@test-cloud
JWT_SECRET=test-jwt-secret-value-with-at-least-32-bytes
app.image.uploader-key-secret=test-image-uploader-key-secret-with-at-least-32-bytes
app.image.cleanup.enabled=false

app.rate-limit.enabled=false

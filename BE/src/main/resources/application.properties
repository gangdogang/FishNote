spring.application.name=fishnote
server.port=${PORT:8080}

# === Small-container server limits ===
# Render 512MB 인스턴스에서 Tomcat 기본 200 threads가 native stack 메모리를 과점유하지 않게 한다.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:32}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:50}

# === Health / metrics ===
# 공개 probe는 상태만 노출하고, metrics endpoint 자체는 Security allowlist에 넣지 않는다.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

# === CORS ===
# 쉼표 구분. 운영에서는 APP_CORS_ALLOWED_ORIGINS 환경변수로 덮어쓴다.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# === PostgreSQL ===
# 로컬 기본값. 운영에서는 SPRING_DATASOURCE_* 환경변수로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fishnote}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# === 커넥션 풀 (Neon serverless 대응) ===
# Neon은 유휴 연결을 서버 쪽에서 끊으므로 max-lifetime을 그보다 짧게 유지한다.
# minimum-idle=0 으로 유휴 시 풀을 비워 Neon 오토서스펜드도 방해하지 않는다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000

# === JPA / Hibernate ===
# 운영 스키마는 Flyway가 변경하고 Hibernate는 엔티티 매핑만 검증한다.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# 지연 로딩 컬렉션(제철 월·맛 태그 등)을 IN 쿼리로 묶어 조회 — N+1 완화
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 후기 aggregate read model. 장애 시 false로 내리면 동일 API가 review live aggregate를 사용한다.
app.read-model.review-stat.enabled=${REVIEW_STAT_READ_MODEL_ENABLED:true}
app.catalog.v2.enabled=${CATALOG_V2_ENABLED:true}
app.price-import.bulk.enabled=${PRICE_IMPORT_BULK_ENABLED:true}
app.sources.enabled=${SOURCES_ENABLED:true}
app.cache.public.enabled=${PUBLIC_CACHE_ENABLED:true}

# === 스키마 마이그레이션 ===
# 기존 DB는 버전 0으로 baseline한 뒤 V1부터 안전하게 적용한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.target=${SPRING_FLYWAY_TARGET:latest}
spring.sql.init.mode=never

# === 이미지 업로드 (Cloudinary — CLOUDINARY_URL 환경변수 필요) ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Cloudinary 호출 전 컨테이너/metadata를 검사하고 제한 적용 뒤 1px subsample decode로 손상을 확인한다.
app.image.max-dimension=8192
app.image.max-pixels=50000000
app.image.pending-ttl=PT1H
app.image.cloudinary-timeout-seconds=${IMAGE_CLOUDINARY_TIMEOUT_SECONDS:10}
# raw IP/user ID 대신 저장할 업로더 HMAC 키 전용 비밀값. 운영에서는 반드시 별도 값으로 설정한다.
app.image.uploader-key-secret=${IMAGE_UPLOADER_KEY_SECRET:}
# 만료·고아 후기 이미지는 작은 batch로 claim한 뒤 DB transaction 밖에서 Cloudinary에서 지운다.
app.image.cleanup.enabled=${IMAGE_CLEANUP_ENABLED:true}
app.image.cleanup.interval=${IMAGE_CLEANUP_INTERVAL:PT10M}
app.image.cleanup.initial-delay=${IMAGE_CLEANUP_INITIAL_DELAY:PT1M}
app.image.cleanup.batch-size=${IMAGE_CLEANUP_BATCH_SIZE:50}
app.image.cleanup.claim-timeout=${IMAGE_CLEANUP_CLAIM_TIMEOUT:PT15M}
app.image.cleanup.uploading-grace=${IMAGE_CLEANUP_UPLOADING_GRACE:PT10M}
app.image.cleanup.retry-base=${IMAGE_CLEANUP_RETRY_BASE:PT10M}
app.image.cleanup.retry-max=${IMAGE_CLEANUP_RETRY_MAX:PT6H}
app.image.cleanup.uploading-tombstone=${IMAGE_CLEANUP_UPLOADING_TOMBSTONE:PT24H}

# === 레이트 리미팅 ===
# 즉시 peer가 이 CIDR에 포함될 때만 X-Forwarded-For를 해석한다. Render는 고정 ingress CIDR을
# 계약으로 제공하지 않으므로 추측값을 넣지 않는다. 별도 private proxy를 직접 운영할 때만 설정한다.
# 미설정 시 전달 헤더를 무시하고 즉시 peer 기준으로 fail-closed 동작한다.
app.client-ip.trusted-proxies=${APP_CLIENT_IP_TRUSTED_PROXIES:}
# 단일 인스턴스용 bounded fixed-window 제한. 2개 이상 인스턴스 전환 전 Redis/Bucket4j로 교체한다.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window-seconds=600
app.rate-limit.max-tracked-actors=10000
app.rate-limit.global-multiplier=100
# 정리 batch(기본 50/주기)보다 낮게 유지해 미첨부 업로드가 quota를 무한히 앞서지 못하게 한다.
app.rate-limit.image-global-limit=${IMAGE_UPLOAD_GLOBAL_LIMIT:40}
# 익명 정정 제보는 actor당 5회/윈도우와 별도 global cap을 모두 적용한다.
app.rate-limit.correction-global-limit=${CORRECTION_GLOBAL_LIMIT:100}
# 공개 correction과 Telegram webhook은 MVC/Jackson 역직렬화 전에 bounded body로 제한한다.
app.request-size.correction-json-bytes=${CORRECTION_JSON_MAX_BYTES:16384}
app.request-size.telegram-json-bytes=${TELEGRAM_JSON_MAX_BYTES:65536}

# 도움돼요 중복 방지용 익명 식별 키 해시 pepper. 운영에서는 별도 값으로 덮어쓴다.
app.helpful-vote.pepper=${HELPFUL_VOTE_PEPPER:fishnote-helpful-vote}

# === Telegram price webhook ===
# 운영에서는 TELEGRAM_WEBHOOK_SECRET 환경변수로 설정한다.
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.connect-timeout=${TELEGRAM_CONNECT_TIMEOUT:PT2S}
app.telegram.read-timeout=${TELEGRAM_READ_TIMEOUT:PT3S}
# 장애 시 root DEBUG가 켜져도 token 포함 요청 URI는 framework log에 남기지 않는다.
logging.level.org.springframework.web.client.RestTemplate=INFO
# Kakao token 교환 form(code/client_secret/redirect_uri)을 framework DEBUG에 남기지 않는다.
logging.level.org.springframework.web.client.DefaultRestClient=INFO
# request/response record의 code/password/JWT가 MVC DEBUG/TRACE에 직렬화되지 않게 한다.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
app.telegram.reply.core-pool-size=${TELEGRAM_REPLY_CORE_POOL_SIZE:1}
app.telegram.reply.max-pool-size=${TELEGRAM_REPLY_MAX_POOL_SIZE:2}
app.telegram.reply.queue-capacity=${TELEGRAM_REPLY_QUEUE_CAPACITY:100}

# === Kakao OAuth ===
# 카카오 디벨로퍼스의 REST API 키와 Client Secret을 서버 환경변수로 설정한다.
app.kakao.oauth.client-id=${KAKAO_REST_API_KEY:}
app.kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET:}
# 요청 redirectUri는 canonicalize하지 않고 이 목록과 문자열 전체가 일치할 때만 허용한다.
# 미설정이면 모두 거부한다. 환경별 Kakao console 등록값과 같은 URI만 쉼표로 구분한다.
app.kakao.oauth.allowed-redirect-uris=${KAKAO_ALLOWED_REDIRECT_URIS:}

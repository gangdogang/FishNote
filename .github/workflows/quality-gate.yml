name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FE
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run frontend quality gate
        run: npm run check

      - name: Collect operational console baseline
        id: operational-console
        if: ${{ always() && vars.OPERATIONAL_BASE_URL != '' }}
        continue-on-error: true
        env:
          OPERATIONAL_BASE_URL: ${{ vars.OPERATIONAL_BASE_URL }}
        run: npm run test:e2e:operational

      - name: Write operational collector status
        if: always()
        env:
          OPERATIONAL_BASE_URL: ${{ vars.OPERATIONAL_BASE_URL }}
          OPERATIONAL_COLLECTOR_OUTCOME: ${{ steps.operational-console.outcome }}
        run: node ../scripts/ci/write-operational-baseline-status.mjs test-results/operational/run-status.json

      - name: Write frontend baseline manifest
        if: always()
        run: node ../scripts/ci/write-baseline-manifest.mjs FE/test-results/q0-manifest.json frontend

      - name: Upload frontend baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q0-frontend-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            FE/test-results
            FE/playwright-report
            FE/coverage

      - name: Upload operational console baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q0-operational-console-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            FE/test-results/operational
            FE/playwright-report-operational

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run H2 and PostgreSQL suites
        run: ./gradlew --no-daemon test integrationTest

      - name: Upload backend baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q0-backend-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            BE/build/reports/baseline
            BE/build/reports/tests
            BE/build/test-results

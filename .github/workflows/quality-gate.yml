name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FE
    env:
      VITE_API_BASE_URL: http://127.0.0.1:4173/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run frontend quality gate
        run: npm run check

      - name: Collect operational console baseline
        id: operational-console
        if: ${{ always() && vars.OPERATIONAL_BASE_URL != '' }}
        continue-on-error: true
        env:
          OPERATIONAL_BASE_URL: ${{ vars.OPERATIONAL_BASE_URL }}
        run: npm run test:e2e:operational

      - name: Write operational collector status
        if: always()
        env:
          OPERATIONAL_BASE_URL: ${{ vars.OPERATIONAL_BASE_URL }}
          OPERATIONAL_COLLECTOR_OUTCOME: ${{ steps.operational-console.outcome }}
        run: node ../scripts/ci/write-operational-baseline-status.mjs test-results/operational/run-status.json

      - name: Write frontend baseline manifest
        if: always()
        run: node ../scripts/ci/write-baseline-manifest.mjs FE/test-results/q0-manifest.json frontend

      - name: Upload frontend baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q0-frontend-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            FE/test-results
            FE/playwright-report
            FE/coverage

      - name: Upload operational console baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q0-operational-console-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            FE/test-results/operational
            FE/playwright-report-operational

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run H2 and PostgreSQL suites
        run: ./gradlew --no-daemon test integrationTest

      - name: Upload backend baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q0-backend-baseline
          if-no-files-found: warn
          retention-days: 30
          path: |
            BE/build/reports/baseline
            BE/build/reports/tests
            BE/build/test-results
